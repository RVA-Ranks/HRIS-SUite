name: Phase 0 checks

on:
  push:
    branches: [main, "docs/**", "phase-*/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-links:
    name: Markdown link validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 20
            README.md
            AGENTS.md
            DANIEL_HRIS_MASTER_IMPLEMENTATION_ROADMAP_FOR_CARL.md
            docs/phase-0/**/*.md
          fail: true

  # Deferred to Phase 1 application scaffold (do not claim Markdownlint is covered by link checks):
  # - Markdownlint
  # - dependency review
  # - lint / typecheck / unit tests / Playwright smoke / production build
